name: Build Pocket Loomy (Android)

# Pushes to claude/** branches build "Pocket Loomy dev" (signed with the public dev key in pocket/),
# so the bot can read compile errors and you can try it from the run's Artifacts.
# Version tags build the real app, signed with your key (secrets below), and attach
# pocket-loomy.apk to that release next to loomy.exe. Only tags ever see the key.
on:
  push:
    branches: ['claude/**']
    tags: ['v*']
    paths: ['pocket/**', 'src/pocket.*', 'src/monocypher*', '.github/workflows/pocket.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.release.outputs.signed }}
    steps:
      - name: Get the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.14.3'

      - name: Version number
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"                       # 2.18 or 2.18b
            major="${v%%.*}"; rest="${v#*.}"
            minor="${rest%%[a-z]*}"; letter="${rest#"$minor"}"
            l=0; [ -n "$letter" ] && l=$(( $(printf '%d' "'$letter") - 96 ))
            echo "name=$v" >> "$GITHUB_OUTPUT"
            echo "code=$(( major * 10000 + minor * 100 + l ))" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the dev APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: pocket
        env:
          POCKET_VERSION: ${{ steps.v.outputs.name }}
          POCKET_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pocket-loomy-dev.apk"

      - name: Keep the dev APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-loomy-dev
          path: ${{ runner.temp }}/pocket-loomy-dev.apk

      - name: Build the release APK (signed with your key)
        id: release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: pocket
        env:
          KEY_B64: ${{ secrets.POCKET_KEYSTORE_B64 }}
          POCKET_KEYSTORE_PASSWORD: ${{ secrets.POCKET_KEYSTORE_PASSWORD }}
          POCKET_VERSION: ${{ steps.v.outputs.name }}
          POCKET_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::No POCKET_KEYSTORE_B64 secret yet, so this release gets no APK."
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          POCKET_KEYSTORE="$RUNNER_TEMP/release.keystore" gradle --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.keystore"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pocket-loomy.apk"
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Keep the release APK
        if: ${{ steps.release.outputs.signed == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-loomy
          path: ${{ runner.temp }}/pocket-loomy.apk

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.build.outputs.signed == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pocket-loomy
      - name: Attach pocket-loomy.apk to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pocket-loomy.apk --clobber --repo "$GITHUB_REPOSITORY"
